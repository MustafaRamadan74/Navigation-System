<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeoRoute - Redirecting...</title>
    <script>
      var pathSegments = window.location.pathname.split('/').filter(Boolean);
      var repoName = pathSegments[0] || 'Navigation-System';
      window.location.replace('/' + repoName + '/docs/');
    </script>
    <meta http-equiv="refresh" content="0; url=./docs/">
  </head>
  <body>
    <p>Redirecting to GeoRoute app... <a href="./docs/">Click here if not redirected</a>.</p>
  </body>
</html>
